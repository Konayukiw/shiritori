<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>しりとり Bot</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", "Noto Sans JP", system-ui, sans-serif;
  background: #f5f5f5;
  color: #222;
  min-height: 100vh;
}
.app {
  display: flex;
  gap: 12px;
  max-width: 960px;
  margin: 0 auto;
  padding: 16px;
  min-height: 100vh;
}
/* Sidebar */
.sidebar {
  width: 220px;
  flex-shrink: 0;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  height: fit-content;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  position: sticky;
  top: 16px;
}
.sidebar h2 { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.sidebar label { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.sidebar input[type="checkbox"] { accent-color: #4a90d9; }
.sidebar button {
  margin-top: 8px;
  padding: 8px 12px;
  border: none;
  border-radius: 6px;
  background: #4a90d9;
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}
.sidebar button:hover { background: #3a7bc8; }
.main {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 0;
}
.log-pane {
  flex: 1;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 12px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-height: 500px;
  max-height: calc(100vh - 170px);
}
.log-entry {
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  word-break: break-word;
}
.log-entry.user  { color: #1565c0; }
.log-entry.bot   { color: #2e7d32; }
.log-entry.system { color: #616161; }
.log-entry.result { color: #c62828; font-weight: 600; }
.log-entry.error  { color: #b71c1c; }
.status-bar {
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 8px 12px;
  font-size: 13px;
  color: #555;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
}
.input-row {
  display: flex;
  gap: 8px;
}
.input-row input[type="text"] {
  flex: 1;
  padding: 10px 14px;
  border: 1px solid #ddd;
  border-radius: 8px;
  font-size: 16px;
  outline: none;
  transition: border 0.15s;
}
.input-row input[type="text"]:focus { border-color: #4a90d9; }
.input-row input[type="text"]:disabled { background: #eee; color: #999; }
.input-row button {
  padding: 10px 20px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
  white-space: nowrap;
}
.btn-submit { background: #4a90d9; color: #fff; }
.btn-submit:hover:not(:disabled) { background: #3a7bc8; }
.btn-submit:disabled { background: #ccc; cursor: not-allowed; }
.btn-reset { background: #e0e0e0; color: #333; }
.btn-reset:hover { background: #ccc; }
.setup-overlay {
  position: fixed;
  inset: 0;
  background: rgba(255,255,255,0.92);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  z-index: 100;
  gap: 12px;
}
.setup-overlay .spinner {
  width: 40px; height: 40px;
  border: 4px solid #e0e0e0;
  border-top-color: #4a90d9;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.setup-overlay p { font-size: 15px; color: #555; max-width: 400px; }
.hidden { display: none !important; }
/* Responsive */
@media (max-width: 600px) {
  .app { flex-direction: column; padding: 8px; }
  .sidebar { width: 100%; position: static; max-height: none; }
  .log-pane { max-height: 50vh; }
  .input-row { flex-wrap: wrap; }
  .input-row button { flex: 1; }
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <h2>設定</h2>
    <label><input type="checkbox" id="cb-person"> 人名を許可</label>
    <label><input type="checkbox" id="cb-place"> 地名を許可</label>
    <label><input type="checkbox" id="cb-org"> 組織名を許可</label>
    <label><input type="checkbox" id="cb-proper"> 固有名詞(一般)を許可</label>
    <label><input type="checkbox" id="cb-other"> その他カテゴリを許可</label>
    <label><input type="checkbox" id="cb-verb"> 動詞を許可</label>
    <label><input type="checkbox" id="cb-ignore-dakuten"> 濁点・半濁点の違いを無視</label>
    <label><input type="checkbox" id="cb-allow-alnum"> 英数字を許可</label>
    <label><input type="checkbox" id="cb-bot-first"> Bot から開始</label>
    <button id="btn-apply">設定を適用して再開</button>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="log-pane" id="log-pane"></div>
    <div class="status-bar" id="status-bar">準備中…</div>
    <div class="input-row">
      <input type="text" id="word-input" placeholder="単語を入力…" disabled autocomplete="off">
      <button class="btn-submit" id="btn-submit" disabled>送信</button>
      <button class="btn-reset" id="btn-reset">リセット</button>
    </div>
  </main>
</div>

<!-- Setup overlay -->
<div class="setup-overlay" id="setup-overlay">
  <div class="spinner"></div>
  <p id="setup-msg">初回セットアップを開始します…</p>
</div>

<script>
(function () {
  var logPane = document.getElementById('log-pane');
  var statusBar = document.getElementById('status-bar');
  var wordInput = document.getElementById('word-input');
  var btnSubmit = document.getElementById('btn-submit');
  var btnReset = document.getElementById('btn-reset');
  var btnApply = document.getElementById('btn-apply');
  var setupOverlay = document.getElementById('setup-overlay');
  var setupMsg = document.getElementById('setup-msg');
  var cbBotFirst = document.getElementById('cb-bot-first');

  var pollTimer = null;
  var setupDone = false;

  function log(sender, message) {
    var div = document.createElement('div');
    div.className = 'log-entry ' + ({
      'あなた': 'user',
      'Bot': 'bot',
      'システム': 'system',
      '結果': 'result',
      'エラー': 'error'
    })[sender] || '';
    div.textContent = '[' + sender + '] ' + message;
    logPane.appendChild(div);
    logPane.scrollTop = logPane.scrollHeight;
  }

  function updateStatus(data) {
    var parts = ['ターン: ' + (data.turn_count || 0)];
    if (data.last_surface) parts.push('直前: ' + data.last_surface);
    if (data.expected_first_mora) parts.push('次: 『' + data.expected_first_mora + '』');
    parts.push('使用済み: ' + (data.used_count || 0) + ' 語');
    statusBar.textContent = parts.join(' | ');
  }

  function setInputEnabled(enabled) {
    wordInput.disabled = !enabled;
    btnSubmit.disabled = !enabled;
  }

  function pollSetup() {
    fetch('/api/log')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var logs = data.log || [];
        if (logs.length > 0) {
          setupMsg.textContent = logs[logs.length - 1];
        }
      })
      .catch(function () {});

    fetch('/api/status')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.setup_done) {
          setupDone = true;
          setupOverlay.classList.add('hidden');
          setInputEnabled(true);
          log('システム', 'しりとり Bot へようこそ！');
          log('システム', '好きな単語を入力して遊んでください。');
          updateStatus(data);
          wordInput.focus();
          if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
        }
      })
      .catch(function () {});
  }

  function submitWord(word) {
    if (!word) return;
    fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ word: word })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (data.user_word) {
          log('あなた', data.user_word + (data.user_reading ? '（' + data.user_reading + '）' : ''));
        }
        if (!data.ok) {
          log('あなた', word + ' → × ' + (data.reason || ''));
          updateStatus(data);
          return;
        }
        if (data.game_over) {
          log('結果', data.game_result);
          log('結果', data.game_over_msg);
          setInputEnabled(false);
          updateStatus(data);
          return;
        }
        if (data.bot_word) {
          log('Bot', data.bot_word + '（' + data.bot_reading + '）');
          log('システム', '→ 次は『' + (data.expected_first_mora || '?') + '』から');
        }
        updateStatus(data);
      })
      .catch(function (e) {
        log('エラー', '通信エラーが発生しました。');
      });
  }

  function restart(botFirst) {
    fetch('/api/restart', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ bot_first: botFirst })
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        logPane.innerHTML = '';
        if (data.events) {
          data.events.forEach(function (ev) { log(ev.sender, ev.message); });
        }
        setInputEnabled(true);
        updateStatus(data);
        wordInput.focus();
      })
      .catch(function (e) {
        log('エラー', '通信エラーが発生しました。');
      });
  }

  function applySettings() {
    var payload = {
      allow_person: document.getElementById('cb-person').checked,
      allow_place: document.getElementById('cb-place').checked,
      allow_org: document.getElementById('cb-org').checked,
      allow_proper: document.getElementById('cb-proper').checked,
      allow_other: document.getElementById('cb-other').checked,
      allow_verb: document.getElementById('cb-verb').checked,
      ignore_dakuten: document.getElementById('cb-ignore-dakuten').checked,
      allow_alnum: document.getElementById('cb-allow-alnum').checked,
      bot_first: cbBotFirst.checked
    };
    fetch('/api/apply_settings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        logPane.innerHTML = '';
        if (data.events) {
          data.events.forEach(function (ev) { log(ev.sender, ev.message); });
        }
        setInputEnabled(true);
        updateStatus(data);
        wordInput.focus();
      })
      .catch(function (e) {
        log('エラー', '通信エラーが発生しました。');
      });
  }

  wordInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      var word = wordInput.value.trim();
      wordInput.value = '';
      if (setupDone && word) submitWord(word);
    }
  });

  btnSubmit.addEventListener('click', function () {
    var word = wordInput.value.trim();
    wordInput.value = '';
    if (setupDone && word) submitWord(word);
  });

  btnReset.addEventListener('click', function () {
    if (!setupDone) return;
    restart(cbBotFirst.checked);
  });

  btnApply.addEventListener('click', function () {
    if (!setupDone) return;
    applySettings();
  });

  pollTimer = setInterval(pollSetup, 500);
  pollSetup();
})();
</script>
</body>
</html>
