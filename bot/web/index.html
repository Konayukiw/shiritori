<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="しりとり Bot — SudachiDict / JMdict / JMnedict をブラウザで直接参照">
<title>しりとり Bot</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h2>設定</h2>
    <label><input type="checkbox" id="cb-person"> 人名を許可</label>
    <label><input type="checkbox" id="cb-place"> 地名を許可</label>
    <label><input type="checkbox" id="cb-org"> 組織名を許可</label>
    <label><input type="checkbox" id="cb-proper"> 固有名詞(一般)を許可</label>
    <label><input type="checkbox" id="cb-other"> その他カテゴリを許可</label>
    <label><input type="checkbox" id="cb-verb"> 動詞を許可</label>
    <label><input type="checkbox" id="cb-ignore-dakuten"> 濁点・半濁点の違いを無視</label>
    <label><input type="checkbox" id="cb-allow-alnum"> 英数字を許可</label>
    <label><input type="checkbox" id="cb-bot-first"> Bot から開始</label>
    <button type="button" id="btn-apply">設定を適用して再開</button>
  </aside>

  <main class="main">
    <div class="log-pane" id="log-pane"></div>
    <div class="status-bar" id="status-bar">準備中…</div>
    <div class="input-row">
      <input type="text" id="word-input" placeholder="単語を入力…" disabled autocomplete="off">
      <button type="button" class="btn-submit" id="btn-submit" disabled>送信</button>
      <button type="button" class="btn-reset" id="btn-reset">リセット</button>
    </div>
  </main>
</div>

<footer class="license">
  語彙データ:
  <a href="https://github.com/WorksApplications/SudachiDict" target="_blank" rel="noopener">SudachiDict</a>
  (Apache-2.0) /
  <a href="https://www.edrdg.org/jmdict/j_jmdict.html" target="_blank" rel="noopener">JMdict</a> /
  <a href="https://www.edrdg.org/enamdict/enamdict_doc.html" target="_blank" rel="noopener">JMnedict</a>
  (CC BY-SA 4.0, EDRDG) via
  <a href="https://github.com/scriptin/jmdict-simplified" target="_blank" rel="noopener">jmdict-simplified</a>
</footer>

<div class="setup-overlay" id="setup-overlay">
  <div class="spinner"></div>
  <p id="setup-msg">原本辞書を準備しています…</p>
</div>

<script type="module" src="./js/main.js"></script>
</body>
</html>
